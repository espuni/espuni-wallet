# APK de laboratorio: esta wallet apuntando a un Trust Lab concreto.
#
# Las cinco cosas que deciden a qué laboratorio apunta —las cuatro listas de
# confianza y el wallet provider— viajan por BuildConfig, así que una wallet por
# entorno o por tenant es este mismo código con otros parámetros. El APK sale
# como debug, para instalar a mano; no está firmado para ninguna tienda.
name: espuni lab APK

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: Publisher del Trust Lab (las cuatro listas cuelgan de él)
        required: false
        default: https://trust-lab-publisher-staging.up.railway.app
      walletProvider:
        description: Wallet provider que firma la WIA
        required: false
        default: https://wallet-provider-staging.up.railway.app
      abi:
        description: ABI única (arm64-v8a deja el APK en 235 MB; vacío = universal)
        required: false
        default: arm64-v8a
  push:
    branches: [espuni/lab]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build dev debug APK
        env:
          PUBLISHER: ${{ inputs.publisher || 'https://trust-lab-publisher-staging.up.railway.app' }}
          WALLET_PROVIDER: ${{ inputs.walletProvider || 'https://wallet-provider-staging.up.railway.app' }}
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          # Con una sola ABI el APK no va a outputs/, sino a intermediates/:
          # es el mismo flujo que usa el IDE para desplegar (ver docs/espuni-fork.md).
          ./gradlew :app:assembleDevDebug --no-daemon --stacktrace \
            -PLAB_PUBLISHER="$PUBLISHER" \
            -PLAB_WALLET_PROVIDER_HOST="$WALLET_PROVIDER" \
            ${ABI:+-Pandroid.injected.build.abi=$ABI}
          mkdir -p apk
          find app/build -name "*.apk" -path "*dev*debug*" -exec cp {} apk/ \;
          ls -lh apk/

      - name: A dónde apunta este APK
        run: find . -name "BuildConfig.java" -path "*corelogic*" -exec grep -h "LAB_" {} \; | sort -u

      - uses: actions/upload-artifact@v4
        with:
          name: espuni-wallet-dev-debug
          path: apk/*.apk
          if-no-files-found: error
