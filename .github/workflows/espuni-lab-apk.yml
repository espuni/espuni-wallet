# APK de laboratorio: esta wallet apuntando a un Trust Lab concreto.
#
# Las cinco cosas que deciden a qué laboratorio apunta —las cuatro listas de
# confianza y el wallet provider— viajan por BuildConfig, así que una wallet por
# entorno o por tenant es este mismo código con otros parámetros. El APK sale
# como debug, para instalar a mano; no está firmado para ninguna tienda.
name: espuni lab APK

on:
  workflow_dispatch:
    inputs:
      publisher:
        description: Publisher del Trust Lab (las cuatro listas cuelgan de él)
        required: false
        default: https://trust-lab-publisher-staging.up.railway.app
      walletProvider:
        description: Wallet provider que firma la WIA
        required: false
        default: https://wallet-provider-staging.up.railway.app
      abi:
        description: ABI única (arm64-v8a baja el tamaño; vacío = universal, instala en cualquier móvil)
        required: false
        default: ''
      requireSignedMetadata:
        description: Exigir los metadatos firmados del emisor (su x5c tiene que encadenar con wrpac-lab)
        required: false
        type: boolean
        default: false
  push:
    branches: [espuni/lab]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Sin esto, cada ejecución genera su propio debug keystore y firma con
      # una clave distinta. El APK resultante no es una actualización del
      # anterior: Android lo rechaza al instalar encima ("paquete inválido",
      # "app not installed"), y hay que desinstalar cada vez. Con el secreto,
      # todas las compilaciones firman igual y el APK se instala encima.
      - name: Clave de firma estable
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Firmando con el keystore del secreto ANDROID_DEBUG_KEYSTORE_B64."
          else
            echo "::warning::Sin ANDROID_DEBUG_KEYSTORE_B64: se firmará con una clave nueva."
            echo "::warning::El APK NO se podrá instalar encima de uno anterior; hay que desinstalar primero."
          fi

      - name: Build dev debug APK
        env:
          PUBLISHER: ${{ inputs.publisher || 'https://trust-lab-publisher-staging.up.railway.app' }}
          WALLET_PROVIDER: ${{ inputs.walletProvider || 'https://wallet-provider-staging.up.railway.app' }}
          ABI: ${{ inputs.abi }}
          REQUIRE_SIGNED_METADATA: ${{ inputs.requireSignedMetadata && 'true' || 'false' }}
        run: |
          # Con una sola ABI el APK no va a outputs/, sino a intermediates/:
          # es el mismo flujo que usa el IDE para desplegar (ver docs/espuni-fork.md).
          ./gradlew :app:assembleDevDebug --no-daemon --stacktrace \
            -PLAB_PUBLISHER="$PUBLISHER" \
            -PLAB_WALLET_PROVIDER_HOST="$WALLET_PROVIDER" \
            -PLAB_REQUIRE_SIGNED_METADATA="$REQUIRE_SIGNED_METADATA" \
            ${ABI:+-Pandroid.injected.build.abi=$ABI}
          mkdir -p apk
          find app/build -name "*.apk" -path "*dev*debug*" -exec cp {} apk/ \;
          ls -lh apk/

      - name: A dónde apunta este APK, y con qué clave va firmado
        run: |
          find . -name "BuildConfig.java" -path "*corelogic*" -exec grep -h "LAB_" {} \; | sort -u
          # La huella del firmante: si cambia entre dos APK, el segundo no se
          # instala encima del primero.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs apk/*.apk | grep -E "SHA-256 digest|Verified using"

      - uses: actions/upload-artifact@v4
        with:
          name: espuni-wallet-dev-debug
          path: apk/*.apk
          if-no-files-found: error
